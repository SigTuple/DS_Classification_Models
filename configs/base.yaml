project:
  name: rbc_qi
  runs_dir: runs

data:
  dataset_dir: /media/sigtupleds/Data/Classification_Model_Training/RBC_QI_Training/data/QI_RBC_DATA_iter_2_training
  train_subdir: train
  test_subdir: test
  image_height: 1088
  image_width: 1440
  num_workers: 8
  classes:
    - coverslip
    - air_bubble
    - clumping
    - debris
    - dust
    - edges
    - focused
    - light_dust
    - slightly_out_of_focus
    - partially_focused
    - shifted
    - slightly_shifted
    - severely_out_of_focus
    - scratches
  # RBC-QI-safe augmentation policy retained from the previous training
  # configuration. Both E0 and E2 inherit this exact policy by default.
  # The active geometric transforms are implemented in rbc_qi/data.py.
  augmentations:
    # Intensity / color: disabled for QI training
    clahe_p: 0.0
    brightness_contrast_p: 0.0
    fancy_pca_p: 0.0
    gauss_noise_p: 0.0
    hue_saturation_value:
      prob: 0.0
      hue: 0
      saturation: 0
      value: 0
    multiplicative_noise_p: 0.0
    posterize_p: 0.0
    rgb_shift_p: 0.0
    random_gamma_p: 0.0
    random_tone_curve_p: 0.0

    # Blur / sharpness: disabled for QI training
    gaussian_blur_p: 0.0
    advanced_blur_p: 0.0
    defocus_p: 0.0
    unsharp_mask_p: 0.0

    # Morphology-distorting operations: disabled for QI training
    elastic_transform_p: 0.0
    perspective_p: 0.0
    ringing_overshoot_p: 0.0
    image_compression_p: 0.0

    # Geometric transformations
    hflip_p: 0.0
    vflip_p: 0.0
    rotate_p: 0.30
    rotate_limit_degrees: 10
    shift_scale_rotate_p: 0.30
    shift_limit: 0.05
    scale_limit: 0.10

    # Existing preprocessing model policy
    apply_sharpen_denoise_model: false
    num_random_transforms: 1

model:
  name: efficientnet_b0
  pretrained: false
  input_features: rgb

training:
  seed: 42
  batch_size: 2
  epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.0001
  label_smoothing: 0.0
  save_every_epochs: 1
  # Require CUDA rather than silently falling back to CPU.
  device: cuda
  progress_every_batches: 25

tracking:
  mlflow:
    enabled: false
    tracking_uri: http://localhost:5001
    experiment_name: rbc_qi
