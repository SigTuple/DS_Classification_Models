experiment:
  id: e4_downscaled_batch4
  description: E3 downscaled RGB dataset with batch size increased to four.

data:
  # Populate this dataset directory before training E3/E4.
  dataset_dir: data/RBC_QI_DATASET_DOWNSCALED_2X
  image_height: 544
  image_width: 720

model:
  input_features: rgb

training:
  batch_size: 4
  # This run is intentionally CPU-only because the host GPU is reserved.
  device: cpu
